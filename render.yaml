services:
  - type: web
    name: video-tiktok-portal
    runtime: static
    buildCommand: ""
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /api/oauth/tiktok/callback
        destination: /callback.html
